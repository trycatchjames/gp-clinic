services:
  postgres:
    image: postgres:17-alpine
    container_name: gp-prototype-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gp
      POSTGRES_PASSWORD: gp
      POSTGRES_DB: gp_prototype
    ports:
      # 5439 to stay clear of any local Postgres on 5432
      - '5439:5432'
    volumes:
      - gp_prototype_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gp -d gp_prototype']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gp_prototype_pgdata:
