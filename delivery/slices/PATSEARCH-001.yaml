acceptance:
  scenarios:
    - file: spec/capabilities/patient-search/acceptance.feature
      name: Medicare card finds family members but does not verify identity
    - file: spec/capabilities/patient-search/acceptance.feature
      name: Similar names remain distinct
  criteria: []
evidence:
  screenshots:
    - initial-search
    - similar-candidates
  flows:
    - multi-identifier-search
    - keyboard-selection
  fixtures:
    - twins-and-shared-family
risk:
  permissions: true
  clinical_safety: true
  data_migration: true
  domains:
    - patient
depends_on:
