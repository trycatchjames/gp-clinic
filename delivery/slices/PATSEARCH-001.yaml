  goal: find the correct existing patient from approved identifiers
  benefit: appointments and records start from a deliberate identity choice rather than a guess
spec_refs:
  - spec/capabilities/patient-search/spec.md
  - spec/domain/patient/invariants.md
  - spec/cross-cutting/search/requirements.md
