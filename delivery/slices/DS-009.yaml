id: DS-009
title: Complete the compact semantic badge atom
kind: enablement
status: delivered
capability: null
story:
  actor: Practice staff
  goal: recognise concise statuses and categories without losing their textual meaning
  benefit: dense clinical and operational views can communicate state consistently without relying on colour
spec_refs:
  - spec/product/experience/README.md
  - spec/product/experience/rules.md
  - spec/product/experience/components.md
acceptance:
  scenarios: []
  criteria:
    - Badge stories demonstrate every approved semantic variant with explicit text
    - Familiar icons supplement rather than replace status labels
    - Long meaningful labels wrap without clipping or horizontal overflow
    - Static badges remain outside the keyboard focus order and add no interactive role
    - Quiet and strong coloured surfaces retain readable badge treatments
evidence:
  screenshots:
    - badge-semantic-variants
  flows: []
  fixtures:
    - storybook-badge-states
risk:
  permissions: false
  clinical_safety: false
  data_migration: false
  domains: []
depends_on:
  - DS-002
out_of_scope:
  - Computing lifecycle, urgency, permission, verification or priority
  - Capability-specific status labels and disclosure rules
  - Interactive filters, toggles or navigation disguised as badges
  - API-connected capability organisms, templates or pages
