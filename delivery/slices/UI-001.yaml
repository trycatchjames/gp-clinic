    - Primitive, pure pattern and API-connected capability component ownership is documented
evidence:
  screenshots:
    - foundation-controls
    - form-states
  flows:
    - keyboard-foundations
  fixtures:
    - design-system-states
risk:
  permissions: false
  clinical_safety: false
  data_migration: false
  domains: []
depends_on: []
out_of_scope:
  - Patient search or other API-connected capability components
  - A complete design system built without product usage
  - Brand identity redesign
