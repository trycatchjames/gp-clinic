id: UI-001
title: Establish the clinical product design system
kind: enablement
status: delivered
capability: null
story:
  actor: Practice staff member
  goal: use a coherent and accessible visual language across core workflows
  benefit: each product slice can focus on task validity without rebuilding interaction or state patterns
spec_refs:
  - spec/product/design-system/README.md
  - spec/product/principles.md
  - spec/product/non-functional-requirements.md
  - spec/cross-cutting/accessibility/requirements.md
acceptance:
  scenarios: []
  criteria:
    - A reviewable component gallery demonstrates the Eucalyptus and Wattle theme, foundational controls and meaningful states
    - Form controls expose labels, descriptions, errors, disabled state and visible keyboard focus
    - Context, summary and data-state patterns remain pure, responsive and reusable
    - Filter and list patterns preserve decision-first hierarchy, explicit selection and keyboard focus movement
    - Atomic design terminology maps to the documented primitive, pattern and capability ownership layers
evidence:
  screenshots:
    - theme-foundations
    - interactive-primitives
    - workflow-patterns
    - list-patterns
    - form-states
    - responsive-patterns
  flows:
    - keyboard-foundations
  fixtures:
    - design-system-states
risk:
  permissions: false
  clinical_safety: false
  data_migration: false
  domains: []
depends_on: []
out_of_scope:
  - Patient search or other API-connected capability components
  - Final capability screen composition or product behaviour
  - Exhaustive chart, calendar and data-grid foundations before a screen contract needs them
  - Marketing identity, illustration or logo design
