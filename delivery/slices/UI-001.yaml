id: UI-001
title: Establish accessible application UI foundations
kind: enablement
status: in_review
capability: null
story:
  actor: Practice staff member
  goal: use consistent and accessible controls across core workflows
  benefit: each product slice can focus on task validity instead of rebuilding interaction basics
spec_refs:
  - spec/product/principles.md
  - spec/product/non-functional-requirements.md
  - spec/cross-cutting/accessibility/requirements.md
acceptance:
