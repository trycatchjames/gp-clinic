name: PR pipeline poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-pipeline-poll
  cancel-in-progress: false

jobs:
  poll:
    if: vars.AGENT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gp/pr-pipeline poll
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_AUTOMATION_ENABLED: ${{ vars.AGENT_AUTOMATION_ENABLED }}
          PIPELINE_MAX_OPEN_PRS: ${{ vars.PIPELINE_MAX_OPEN_PRS }}
          TRUSTED_REVIEWERS: ${{ vars.TRUSTED_REVIEWERS }}
