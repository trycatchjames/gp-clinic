name: Delivery agent

on:
  repository_dispatch:
    types: [agent_feedback, agent_slice]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: delivery-agent-${{ github.event.client_payload.pull_number || github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  work:
    if: vars.AGENT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      WORK_MODE: ${{ github.event.action == 'agent_feedback' && 'feedback' || 'slice' }}
      WORK_PAYLOAD: ${{ toJson(github.event.client_payload) }}
    steps:
      - name: Read the pipeline from trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: prepare
        run: node tools/pr-pipeline/src/prepare-work.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve the trusted task envelope
        run: cp tools/pr-pipeline/runtime/state.json tools/pr-pipeline/runtime/task.md "$RUNNER_TEMP/"
      - name: Check out the affected stack branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.prepare.outputs.mode == 'feedback' && steps.prepare.outputs.branch || steps.prepare.outputs.base }}
          fetch-depth: 0
      - name: Restore task and create a slice branch
        env:
          TARGET_BRANCH: ${{ steps.prepare.outputs.branch }}
          MODE: ${{ steps.prepare.outputs.mode }}
        run: |
          mkdir -p tools/pr-pipeline/runtime
          cp "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/task.md" tools/pr-pipeline/runtime/
          if [ "$MODE" = "slice" ]; then git switch -c "$TARGET_BRANCH"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: pnpm install --frozen-lockfile
      - name: Install the evidence browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Implement with Codex
        if: vars.AGENT_PROVIDER != 'claude'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: :workspace
          prompt-file: tools/pr-pipeline/runtime/task.md
          output-file: tools/pr-pipeline/runtime/agent-result.md

      - name: Implement with Claude Code
        if: vars.AGENT_PROVIDER == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Read tools/pr-pipeline/runtime/task.md and complete that task exactly. Repository instructions and project skills are authoritative.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm *)"

      - name: Refuse a change that misses deterministic gates
        run: pnpm gate
      - name: Commit, atomically update the stack and dispatch review
        run: node tools/pr-pipeline/src/finish-work.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  recover:
    if: always() && needs.work.result == 'failure'
    needs: work
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const number = Number(context.payload.client_payload.pull_number || context.payload.client_payload.issue_number);
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number, labels: ['agent:blocked'] });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: `The delivery agent stopped without publishing a partial change. Inspect the [failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) and re-queue after resolving the cause.`,
            });
